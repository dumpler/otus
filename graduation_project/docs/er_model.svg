<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title desc">
  <title id="title">ER model for office workplace booking system</title>
  <desc id="desc">Clear ER model with replicated directory tables, office model, booking model and audit log.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .area { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .area-title { font: 700 20px Arial, sans-serif; fill: #111827; }
      .table { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .head-dir { fill: #fef3c7; }
      .head-office { fill: #dbeafe; }
      .head-booking { fill: #dcfce7; }
      .head-audit { fill: #fee2e2; }
      .title { font: 700 14px Arial, sans-serif; fill: #111827; }
      .field { font: 12px Arial, sans-serif; fill: #334155; }
      .pk { font-weight: 700; fill: #111827; }
      .fk { fill: #1d4ed8; }
      .note { font: 13px Arial, sans-serif; fill: #475569; }
      .rel { fill: none; stroke: #475569; stroke-width: 1.7; }
      .rep { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 8 6; }
      .label { font: 12px Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#475569"/>
    </marker>
    <marker id="rep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1300"/>
  <text x="40" y="45" style="font: 700 28px Arial, sans-serif; fill: #111827;">Система бронирования рабочих мест: ER-модель</text>
  <text x="40" y="73" class="note">Слева внешний каталог directory_db. Пунктирные стрелки показывают логическую репликацию в одноименные таблицы основной БД.</text>

  <rect class="area" x="30" y="100" width="310" height="720"/>
  <text x="55" y="135" class="area-title">directory_db / office</text>

  <rect class="area" x="390" y="100" width="570" height="1070"/>
  <text x="415" y="135" class="area-title">main_db / office</text>

  <rect class="area" x="1010" y="100" width="390" height="780"/>
  <text x="1035" y="135" class="area-title">main_db / booking</text>

  <rect class="area" x="1010" y="930" width="390" height="210"/>
  <text x="1035" y="965" class="area-title">main_db / audit</text>

  <!-- directory_db -->
  <g id="dir_departments">
    <rect class="table" x="60" y="170" width="245" height="120"/>
    <rect class="head-dir" x="60" y="170" width="245" height="32" rx="8"/>
    <text class="title" x="75" y="191">office.departments</text>
    <text class="field pk" x="75" y="222">PK id</text>
    <text class="field" x="75" y="244">code UNIQUE</text>
    <text class="field" x="75" y="266">name, is_active</text>
  </g>

  <g id="dir_roles">
    <rect class="table" x="60" y="330" width="245" height="120"/>
    <rect class="head-dir" x="60" y="330" width="245" height="32" rx="8"/>
    <text class="title" x="75" y="351">office.roles</text>
    <text class="field pk" x="75" y="382">PK id</text>
    <text class="field" x="75" y="404">code UNIQUE</text>
    <text class="field" x="75" y="426">name, is_active</text>
  </g>

  <g id="dir_employees">
    <rect class="table" x="60" y="490" width="245" height="145"/>
    <rect class="head-dir" x="60" y="490" width="245" height="32" rx="8"/>
    <text class="title" x="75" y="511">office.employees</text>
    <text class="field pk" x="75" y="542">PK id</text>
    <text class="field" x="75" y="564">email</text>
    <text class="field" x="75" y="586">last_name, first_name, middle_name</text>
    <text class="field fk" x="75" y="608">FK department_code</text>
  </g>

  <g id="dir_employee_roles">
    <rect class="table" x="60" y="675" width="245" height="105"/>
    <rect class="head-dir" x="60" y="675" width="245" height="32" rx="8"/>
    <text class="title" x="75" y="696">office.employee_roles</text>
    <text class="field fk" x="75" y="727">FK employee_id</text>
    <text class="field fk" x="75" y="749">FK role_code</text>
  </g>

  <!-- main office: replicated tables -->
  <g id="office_departments">
    <rect class="table" x="430" y="170" width="240" height="120"/>
    <rect class="head-office" x="430" y="170" width="240" height="32" rx="8"/>
    <text class="title" x="445" y="191">office.departments</text>
    <text class="field pk" x="445" y="222">PK id</text>
    <text class="field" x="445" y="244">code UNIQUE</text>
    <text class="field" x="445" y="266">name, is_active</text>
  </g>

  <g id="office_roles">
    <rect class="table" x="430" y="330" width="240" height="120"/>
    <rect class="head-office" x="430" y="330" width="240" height="32" rx="8"/>
    <text class="title" x="445" y="351">office.roles</text>
    <text class="field pk" x="445" y="382">PK id</text>
    <text class="field" x="445" y="404">code UNIQUE</text>
    <text class="field" x="445" y="426">name, is_active</text>
  </g>

  <g id="office_employees">
    <rect class="table" x="430" y="490" width="240" height="145"/>
    <rect class="head-office" x="430" y="490" width="240" height="32" rx="8"/>
    <text class="title" x="445" y="511">office.employees</text>
    <text class="field pk" x="445" y="542">PK id</text>
    <text class="field" x="445" y="564">email</text>
    <text class="field" x="445" y="586">last_name, first_name, middle_name</text>
    <text class="field fk" x="445" y="608">FK department_code</text>
  </g>

  <g id="office_employee_roles">
    <rect class="table" x="430" y="675" width="240" height="105"/>
    <rect class="head-office" x="430" y="675" width="240" height="32" rx="8"/>
    <text class="title" x="445" y="696">office.employee_roles</text>
    <text class="field fk" x="445" y="727">FK employee_id</text>
    <text class="field fk" x="445" y="749">FK role_code</text>
  </g>

  <!-- main office: local tables -->
  <g id="offices">
    <rect class="table" x="710" y="170" width="220" height="120"/>
    <rect class="head-office" x="710" y="170" width="220" height="32" rx="8"/>
    <text class="title" x="725" y="191">office.offices</text>
    <text class="field pk" x="725" y="222">PK id</text>
    <text class="field" x="725" y="244">code, name</text>
    <text class="field" x="725" y="266">address</text>
  </g>

  <g id="floors">
    <rect class="table" x="710" y="330" width="220" height="120"/>
    <rect class="head-office" x="710" y="330" width="220" height="32" rx="8"/>
    <text class="title" x="725" y="351">office.floors</text>
    <text class="field pk" x="725" y="382">PK id</text>
    <text class="field fk" x="725" y="404">FK office_id</text>
    <text class="field" x="725" y="426">number, name</text>
  </g>

  <g id="zones">
    <rect class="table" x="710" y="490" width="220" height="120"/>
    <rect class="head-office" x="710" y="490" width="220" height="32" rx="8"/>
    <text class="title" x="725" y="511">office.zones</text>
    <text class="field pk" x="725" y="542">PK id</text>
    <text class="field fk" x="725" y="564">FK floor_id</text>
    <text class="field" x="725" y="586">code, name</text>
  </g>

  <g id="workplace_types">
    <rect class="table" x="710" y="650" width="220" height="95"/>
    <rect class="head-office" x="710" y="650" width="220" height="32" rx="8"/>
    <text class="title" x="725" y="671">office.workplace_types</text>
    <text class="field pk" x="725" y="702">PK id</text>
    <text class="field" x="725" y="724">code, name</text>
  </g>

  <g id="workplaces">
    <rect class="table" x="710" y="785" width="220" height="145"/>
    <rect class="head-office" x="710" y="785" width="220" height="32" rx="8"/>
    <text class="title" x="725" y="806">office.workplaces</text>
    <text class="field pk" x="725" y="837">PK id</text>
    <text class="field fk" x="725" y="859">FK zone_id</text>
    <text class="field fk" x="725" y="881">FK type_id</text>
    <text class="field" x="725" y="903">code, equipment flags</text>
  </g>

  <g id="floor_plans">
    <rect class="table" x="430" y="835" width="240" height="120"/>
    <rect class="head-office" x="430" y="835" width="240" height="32" rx="8"/>
    <text class="title" x="445" y="856">office.floor_plans</text>
    <text class="field pk" x="445" y="887">PK id</text>
    <text class="field fk" x="445" y="909">FK floor_id</text>
    <text class="field" x="445" y="931">svg_content, size</text>
  </g>

  <g id="map_points">
    <rect class="table" x="430" y="995" width="240" height="145"/>
    <rect class="head-office" x="430" y="995" width="240" height="32" rx="8"/>
    <text class="title" x="445" y="1016">office.workplace_map_points</text>
    <text class="field pk" x="445" y="1047">PK id</text>
    <text class="field fk" x="445" y="1069">FK floor_plan_id</text>
    <text class="field fk" x="445" y="1091">FK workplace_id</text>
    <text class="field" x="445" y="1113">x, y, width, height</text>
  </g>

  <g id="unavailability">
    <rect class="table" x="710" y="970" width="220" height="120"/>
    <rect class="head-office" x="710" y="970" width="220" height="32" rx="8"/>
    <text class="title" x="725" y="991">office.workplace_unavailability</text>
    <text class="field pk" x="725" y="1022">PK id</text>
    <text class="field fk" x="725" y="1044">FK workplace_id</text>
    <text class="field" x="725" y="1066">unavailable_period</text>
  </g>

  <!-- booking -->
  <g id="booking_statuses">
    <rect class="table" x="1045" y="170" width="310" height="120"/>
    <rect class="head-booking" x="1045" y="170" width="310" height="32" rx="8"/>
    <text class="title" x="1060" y="191">booking.booking_statuses</text>
    <text class="field pk" x="1060" y="222">PK id</text>
    <text class="field" x="1060" y="244">code UNIQUE</text>
    <text class="field" x="1060" y="266">name, is_final</text>
  </g>

  <g id="cancel_reasons">
    <rect class="table" x="1045" y="330" width="310" height="120"/>
    <rect class="head-booking" x="1045" y="330" width="310" height="32" rx="8"/>
    <text class="title" x="1060" y="351">booking.cancellation_reasons</text>
    <text class="field pk" x="1060" y="382">PK id</text>
    <text class="field" x="1060" y="404">code UNIQUE</text>
    <text class="field" x="1060" y="426">name, is_active</text>
  </g>

  <g id="bookings">
    <rect class="table" x="1045" y="500" width="310" height="190"/>
    <rect class="head-booking" x="1045" y="500" width="310" height="32" rx="8"/>
    <text class="title" x="1060" y="521">booking.bookings</text>
    <text class="field pk" x="1060" y="552">PK id</text>
    <text class="field fk" x="1060" y="574">FK employee_id</text>
    <text class="field fk" x="1060" y="596">FK workplace_id</text>
    <text class="field fk" x="1060" y="618">FK status_id, cancellation_reason_id</text>
    <text class="field" x="1060" y="640">booked_period TSTZRANGE</text>
    <text class="field" x="1060" y="662">EXCLUDE: workplace + time overlap</text>
  </g>

  <g id="booking_history">
    <rect class="table" x="1045" y="735" width="310" height="120"/>
    <rect class="head-booking" x="1045" y="735" width="310" height="32" rx="8"/>
    <text class="title" x="1060" y="756">booking.booking_status_history</text>
    <text class="field pk" x="1060" y="787">PK id</text>
    <text class="field fk" x="1060" y="809">FK booking_id</text>
    <text class="field fk" x="1060" y="831">FK old_status_id, new_status_id</text>
  </g>

  <!-- audit -->
  <g id="audit_log">
    <rect class="table" x="1045" y="990" width="310" height="105"/>
    <rect class="head-audit" x="1045" y="990" width="310" height="32" rx="8"/>
    <text class="title" x="1060" y="1011">audit.change_log</text>
    <text class="field pk" x="1060" y="1042">PK id</text>
    <text class="field" x="1060" y="1064">operation, row_pk</text>
    <text class="field" x="1060" y="1086">old_data, new_data</text>
  </g>

  <!-- replication -->
  <path class="rep" marker-end="url(#rep-arrow)" d="M305 230 H430"/>
  <path class="rep" marker-end="url(#rep-arrow)" d="M305 390 H430"/>
  <path class="rep" marker-end="url(#rep-arrow)" d="M305 562 H430"/>
  <path class="rep" marker-end="url(#rep-arrow)" d="M305 727 H430"/>
  <text class="label" x="332" y="215">logical replication</text>

  <!-- directory internal FKs -->
  <path class="rel" marker-end="url(#arrow)" d="M182 490 V290"/>
  <path class="rel" marker-end="url(#arrow)" d="M135 675 V635"/>
  <path class="rel" marker-end="url(#arrow)" d="M230 675 V450"/>

  <!-- office replicated FKs -->
  <path class="rel" marker-end="url(#arrow)" d="M550 490 V290"/>
  <path class="rel" marker-end="url(#arrow)" d="M500 675 V635"/>
  <path class="rel" marker-end="url(#arrow)" d="M620 675 V450"/>

  <!-- office local FKs -->
  <path class="rel" marker-end="url(#arrow)" d="M820 330 V290"/>
  <path class="rel" marker-end="url(#arrow)" d="M820 490 V450"/>
  <path class="rel" marker-end="url(#arrow)" d="M820 785 V610"/>
  <path class="rel" marker-end="url(#arrow)" d="M860 785 V745"/>
  <path class="rel" marker-end="url(#arrow)" d="M670 895 H710"/>
  <path class="rel" marker-end="url(#arrow)" d="M550 995 V955"/>
  <path class="rel" marker-end="url(#arrow)" d="M670 1068 H710"/>
  <path class="rel" marker-end="url(#arrow)" d="M820 970 V930"/>

  <!-- booking FKs -->
  <path class="rel" marker-end="url(#arrow)" d="M1045 574 H670"/>
  <path class="rel" marker-end="url(#arrow)" d="M1045 596 H930"/>
  <path class="rel" marker-end="url(#arrow)" d="M1200 500 V290"/>
  <path class="rel" marker-end="url(#arrow)" d="M1245 500 V450"/>
  <path class="rel" marker-end="url(#arrow)" d="M1200 735 V690"/>

  <!-- audit triggers -->
  <path class="rep" marker-end="url(#rep-arrow)" d="M1250 690 V990"/>
  <path class="rep" marker-end="url(#rep-arrow)" d="M930 1030 H1045"/>
  <text class="label" x="1260" y="895">audit triggers</text>

  <!-- legend -->
  <rect x="40" y="1180" width="1280" height="65" fill="#ffffff" stroke="#cbd5e1" rx="10"/>
  <rect x="65" y="1200" width="16" height="16" fill="#fef3c7"/>
  <text class="field" x="90" y="1213">directory_db source</text>
  <rect x="235" y="1200" width="16" height="16" fill="#dbeafe"/>
  <text class="field" x="260" y="1213">office schema</text>
  <rect x="390" y="1200" width="16" height="16" fill="#dcfce7"/>
  <text class="field" x="415" y="1213">booking schema</text>
  <rect x="555" y="1200" width="16" height="16" fill="#fee2e2"/>
  <text class="field" x="580" y="1213">audit schema</text>
  <line x1="720" y1="1208" x2="775" y2="1208" class="rel" marker-end="url(#arrow)"/>
  <text class="field" x="790" y="1213">foreign key</text>
  <line x1="930" y1="1208" x2="985" y2="1208" class="rep" marker-end="url(#rep-arrow)"/>
  <text class="field" x="1000" y="1213">logical replication / trigger flow</text>
</svg>
